<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1b2e">
  <meta name="description" content="Acesse a Central Comercial — Mais Hidro Soluções.">
  <title>Entrar · Mais Hidro Soluções</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="login-logo-frame">
          <img src="assets/images/logo-mais.jpg" alt="Mais Hidro Soluções" loading="eager">
        </div>
      </div>

      <!-- Header -->
      <div class="login-header">
        <span class="login-eyebrow">
          <span class="login-eyebrow-dot"></span>
          Central Comercial
        </span>
        <h1>Bem-vindo de volta</h1>
        <p>Entre com suas credenciais para acessar a plataforma comercial.</p>
      </div>

      <!-- Form -->
      <form class="login-form" id="loginForm" novalidate>
        <div class="login-field">
          <label for="loginEmail">E-mail</label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input id="loginEmail" type="email" autocomplete="username" placeholder="voce@empresa.com" required>
          </div>
        </div>

        <div class="login-field">
          <label for="loginPassword">Senha</label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M12 16v2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Sua senha" required>
            <button type="button" class="login-password-toggle" id="togglePassword" aria-label="Mostrar senha">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </div>

        <!-- Error -->
        <div class="login-error" id="loginError" role="alert"></div>

        <!-- Submit -->
        <button type="submit" class="login-submit" id="loginSubmit">
          <span class="login-submit-text">Entrar</span>
          <span class="login-spinner"></span>
        </button>
      </form>

      <!-- Security -->
      <div class="login-security">
        <svg class="login-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Conexão protegida · Supabase Auth
      </div>

      <!-- Accent line -->
      <div class="login-accent-line"></div>
    </div>

    <!-- Footer -->
    <div class="login-footer" style="position:fixed;bottom:18px;left:0;right:0;">
      Mais Hidro Soluções · Central Comercial
    </div>
  </div>

  <script src="assets/js/supabase-config.js"></script>
  <script>
  (() => {
    const config = window.SUPABASE_CONFIG || {};
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("loginEmail");
    const passwordInput = document.getElementById("loginPassword");
    const submitBtn = document.getElementById("loginSubmit");
    const errorEl = document.getElementById("loginError");
    const toggleBtn = document.getElementById("togglePassword");

    // Toggle password visibility
    toggleBtn?.addEventListener("click", () => {
      const reveal = passwordInput.type === "password";
      passwordInput.type = reveal ? "text" : "password";
      toggleBtn.setAttribute("aria-label", reveal ? "Ocultar senha" : "Mostrar senha");
    });

    // Show error
    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add("visible");
    }
    function hideError() {
      errorEl.classList.remove("visible");
    }

    // Set loading state
    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.classList.toggle("loading", loading);
    }

    // Load Supabase library
    async function loadSupabase() {
      if (window.supabase?.createClient) return window.supabase;
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        script.async = true;
        script.onload = () => window.supabase?.createClient
          ? resolve(window.supabase)
          : reject(new Error("Biblioteca do Supabase não carregada."));
        script.onerror = () => reject(new Error("Não foi possível carregar o Supabase."));
        document.head.appendChild(script);
      });
    }

    // Check if already logged in
    async function checkExistingSession() {
      if (!config.SUPABASE_URL || !config.SUPABASE_ANON_KEY) return;
      try {
        const lib = await loadSupabase();
        const client = lib.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
          auth: { persistSession: true, autoRefreshToken: true }
        });
        const { data } = await client.auth.getSession();
        if (data.session?.user) {
          window.location.replace("index.html");
        }
      } catch {
        // Silently ignore — user will log in manually
      }
    }
    checkExistingSession();

    // Handle form submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        showError("Informe seu e-mail e senha.");
        return;
      }

      // Validate config
      if (!config.SUPABASE_URL || !config.SUPABASE_ANON_KEY) {
        showError("A conexão do Supabase ainda não foi configurada. Peça ao administrador para preencher o arquivo supabase-config.js.");
        return;
      }

      setLoading(true);

      try {
        const lib = await loadSupabase();
        const client = lib.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
          auth: { persistSession: true, autoRefreshToken: true }
        });

        const { error } = await client.auth.signInWithPassword({ email, password });

        if (error) {
          const messages = {
            "Invalid login credentials": "E-mail ou senha incorretos.",
            "Email not confirmed": "Confirme seu e-mail antes de entrar.",
            "Too many requests": "Muitas tentativas. Aguarde um momento."
          };
          throw new Error(messages[error.message] || error.message || "Não foi possível entrar.");
        }

        // Also save connection to localStorage for backward compatibility
        localStorage.setItem("mais_hidro_supabase_connection_v1", JSON.stringify({
          url: config.SUPABASE_URL,
          apiKey: config.SUPABASE_ANON_KEY
        }));

        // Redirect to dashboard
        window.location.replace("index.html");

      } catch (err) {
        showError(err.message || "Erro ao conectar. Verifique sua internet e tente novamente.");
        setLoading(false);
      }
    });
  })();
  </script>
</body>
</html>
